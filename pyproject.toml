[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-ai"
version = "1.0.0"
description = "AI-powered Red Team Pentesting Agent built with LangGraph"
readme = "dexter_ai/README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.20",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "streamlit>=1.28.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = ["langchain-openai"]       # also covers OpenRouter
anthropic = ["langchain-anthropic"]
ollama = ["langchain-ollama", "ollama>=0.1.0"]
mcp = ["mcp[cli]>=1.0.0"]          # FastMCP for AI client integration
all = ["dexter-ai[openai,anthropic,ollama,mcp]"]
dev = ["pytest>=7.0", "pyyaml", "mcp[cli]>=1.0.0"]

[project.scripts]
dexter-ai = "dexter_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dexter_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
