version: "3.9"

# ── Dexter AI Pentest – Docker Compose ──────────────────────────────────────────
#
#  Everything runs from the SAME image.  Docker and the CLI are one thing —
#  Docker is just how you package and run it.
#
#  Common commands:
#    docker compose run --rm dexter-ai                        # interactive CLI  (default)
#    docker compose run --rm dexter-ai python -m dexter_ai.cli run -t example.com
#    docker compose up   dexter-ai                            # Streamlit web UI on :8501
#
#  Switch to the web UI:
#    Override the command:  command: streamlit run dexter_ai/app.py --server.address=0.0.0.0

services:
  # ── Dexter AI (CLI + web UI — same image, different command) ─────────────────
  dexter-ai:
    build: .
    image: dexter-ai:latest
    ports:
      - "8501:8501"   # Streamlit web UI  (used when command is overridden to streamlit)
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Dexter AI Pentest}
      - AUTHORIZED_SCOPES=${AUTHORIZED_SCOPES:-example.com,test.local,127.0.0.1,localhost}
      - SCOPE_MODE=${SCOPE_MODE:-open}
      - LOOT_DIR=/app/loot
    volumes:
      - ./loot:/app/loot
      - ./sessions:/app/sessions
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    # Default: interactive CLI.  Override to "streamlit run dexter_ai/app.py ..."
    # for the web UI.
    command: python -m dexter_ai.cli

  # ── Local Ollama (optional, used when LLM_PROVIDER=ollama) ───────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
